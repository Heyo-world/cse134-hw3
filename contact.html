<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Tia Lim's Contact Page</title>
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
</head>

<body>
	<header>
		<h1>Portfolio</h1>
		<nav>
      <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact Me</a></li>
          <li><a href="experiments.html">Experiments</a></li>
      </ul>
  </nav>
	</header>
	<hr>
	<main>
		<section>
			<h2>Get In Touch</h2>
			<dialog open>Open dialog window</dialog>
			<img src="github_logo.webp" alt="Github Logo" width="100" height="100">
        	<p>Check out my Github</p>
			<img src="linkedIn_logo.webp" alt="LinkedIn Logo" width="100" height="100">
        	<p>Chat with me on LinkedIn</p>
			<img src="gmail_logo.svg" alt="Gmail Logo" width="100" height="100">
        	<p>Reach out through Gmail</p>

			<form action="#" method="POST">
                <fieldset>
                    <legend>Send a Message</legend>
                    <label for="cname">Name:</label>
                    <input type="text" id="cname" name="cname"><br><br>
                    <textarea id="cmessage" name="cmessage" rows="3"></textarea><br>
                    <button type="button">Submit</button>
                </fieldset>
            </form>
		</section>
  </main>

	<footer>
        <p><a href="https://github.com">Github</a> | <a href="https://linkedin.com">LinkedIn</a></p>
    </footer>
</body>
</html>
